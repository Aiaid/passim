name: l2tp
category: vpn
version: 1.0.0
icon: lock
description:
  en-US: "L2TP/IPSec VPN server for broad device compatibility"
  zh-CN: "L2TP/IPSec VPN 服务器，兼容各种设备"
source:
  url: https://github.com/hwdsl2/docker-ipsec-vpn-server
  license: MIT
limitations:
  - "Requires NET_ADMIN capability"
  - "Requires access to /lib/modules on the host for kernel modules"
  - "UDP ports 500 and 4500 must not be in use by other services"
settings:
  - key: vpn_user
    type: string
    default: "vpnuser"
    label:
      en-US: "VPN Username"
      zh-CN: "VPN 用户名"
    description:
      en-US: "Username for VPN authentication"
      zh-CN: "VPN 认证用户名"
  - key: vpn_password
    type: string
    default: "{{generated.vpn_password}}"
    label:
      en-US: "VPN Password"
      zh-CN: "VPN 密码"
    description:
      en-US: "Password for VPN authentication"
      zh-CN: "VPN 认证密码"
  - key: vpn_psk
    type: string
    default: "{{generated.vpn_psk}}"
    label:
      en-US: "Pre-Shared Key"
      zh-CN: "预共享密钥"
    description:
      en-US: "IPSec pre-shared key for connection setup"
      zh-CN: "IPSec 连接预共享密钥"
generated:
  - key: vpn_password
    type: random_string
    length: 16
  - key: vpn_psk
    type: random_string
    length: 24
container:
  image: hwdsl2/ipsec-vpn-server
  ports:
    - "500:500/udp"
    - "4500:4500/udp"
  volumes:
    - "{{app.dir}}/configs:/etc/ipsec.d"
    - "/lib/modules:/lib/modules:ro"
  environment:
    VPN_IPSEC_PSK: "{{settings.vpn_psk}}"
    VPN_USER: "{{settings.vpn_user}}"
    VPN_PASSWORD: "{{settings.vpn_password}}"
  labels:
    io.passim: vpn
    io.passim.app: l2tp
  cap_add:
    - NET_ADMIN
clients:
  type: credentials
  fields:
    - key: server
      label:
        en-US: "Server"
        zh-CN: "服务器"
      value: "{{node.public_ip}}"
    - key: username
      label:
        en-US: "Username"
        zh-CN: "用户名"
      value: "{{settings.vpn_user}}"
    - key: password
      label:
        en-US: "Password"
        zh-CN: "密码"
      value: "{{settings.vpn_password}}"
      secret: true
    - key: psk
      label:
        en-US: "Pre-Shared Key"
        zh-CN: "预共享密钥"
      value: "{{settings.vpn_psk}}"
      secret: true
share:
  supports: true
  share_content: [client_config, guide]
guide:
  setup:
    en-US: "Set your VPN credentials and start the server. The pre-shared key (PSK), username, and password are required to connect."
    zh-CN: "设置 VPN 凭据并启动服务器。连接时需要预共享密钥 (PSK)、用户名和密码。"
  usage:
    en-US: "Configure your device's built-in L2TP/IPSec VPN client with the server IP, PSK, username, and password."
    zh-CN: "使用服务器 IP、PSK、用户名和密码配置设备自带的 L2TP/IPSec VPN 客户端。"
  platforms:
    - name: iOS
      notes:
        en-US: "L2TP/IPSec is built into iOS — no app to install."
        zh-CN: "L2TP/IPSec 是 iOS 自带功能，无需安装任何 App。"
      clients:
        - name: iOS Settings
          recommended: true
          builtin: true
          steps:
            en-US:
              - "Open the Settings app on your iPhone."
              - "General → VPN & Device Management → VPN → Add VPN Configuration."
              - "Type: 'L2TP'."
              - "Description: anything you like (e.g. 'My VPN')."
              - "Server: copy the 'Server' value from the credentials shown above."
              - "Account: copy the 'Username' value."
              - "Password: copy the 'Password' value."
              - "Secret: copy the 'Pre-Shared Key' value."
              - "Tap 'Done', then toggle the connection on at the top of the VPN list."
            zh-CN:
              - "打开「设置」App。"
              - "通用 → VPN 与设备管理 → VPN → 添加 VPN 配置。"
              - "类型选「L2TP」。"
              - "描述：随便起一个名字（例如 'My VPN'）。"
              - "服务器：复制上方凭据中的「服务器」值。"
              - "账户：复制「用户名」值。"
              - "密码：复制「密码」值。"
              - "密钥（Secret）：复制「预共享密钥」值。"
              - "点「完成」，然后在 VPN 列表顶部打开开关。"
    - name: Android
      notes:
        en-US: "Android removed the built-in L2TP client in Android 12. On newer phones, use a third-party app such as 'OpenL2TP' or switch to WireGuard / Hysteria."
        zh-CN: "Android 12 起系统去掉了自带 L2TP 客户端。新机请安装第三方 App（如 OpenL2TP），或改用 WireGuard / Hysteria。"
      clients:
        - name: Android Settings (Android 11 and below)
          builtin: true
          steps:
            en-US:
              - "Open Settings → Network & Internet → VPN."
              - "Tap '+' to add a new VPN."
              - "Name: anything you like."
              - "Type: 'L2TP/IPSec PSK'."
              - "Server address: copy 'Server' from above."
              - "IPSec pre-shared key: copy 'Pre-Shared Key'."
              - "Save, tap the new entry, enter Username and Password, then 'Connect'."
            zh-CN:
              - "打开「设置」→「网络和互联网」→「VPN」。"
              - "点 '+' 添加 VPN。"
              - "名称：随便起。"
              - "类型：选「L2TP/IPSec PSK」。"
              - "服务器地址：复制上方「服务器」。"
              - "IPSec 预共享密钥：复制上方「预共享密钥」。"
              - "保存后点新条目，输入用户名和密码，点「连接」。"
    - name: Windows
      clients:
        - name: Windows Settings
          recommended: true
          builtin: true
          steps:
            en-US:
              - "Open Settings → Network & Internet → VPN → Add VPN."
              - "VPN provider: 'Windows (built-in)'."
              - "Connection name: anything you like."
              - "Server name or address: copy 'Server' from above."
              - "VPN type: 'L2TP/IPSec with pre-shared key'."
              - "Pre-shared key: copy 'Pre-Shared Key' from above."
              - "Sign-in info: 'User name and password'."
              - "User name + Password: copy from above. Save."
              - "Click the connection in the VPN list and 'Connect'."
            zh-CN:
              - "打开「设置」→「网络和 Internet」→「VPN」→ 添加 VPN。"
              - "VPN 提供商：选「Windows（内置）」。"
              - "连接名称：随便起。"
              - "服务器名称或地址：复制上方「服务器」。"
              - "VPN 类型：选「使用预共享密钥的 L2TP/IPSec」。"
              - "预共享密钥：复制上方「预共享密钥」。"
              - "登录信息类型：选「用户名和密码」。"
              - "用户名和密码：复制上方对应值。保存。"
              - "在 VPN 列表点新连接 →「连接」。"
    - name: macOS
      notes:
        en-US: "macOS Ventura (13.0) removed the built-in L2TP client. On newer macOS, use a third-party tool or switch to WireGuard."
        zh-CN: "macOS Ventura（13.0）起去掉了自带 L2TP。新版 macOS 请使用第三方工具或改用 WireGuard。"
      clients:
        - name: macOS Network Settings (macOS 12 and earlier)
          builtin: true
          steps:
            en-US:
              - "Open System Preferences → Network."
              - "Click '+' at the bottom left → Interface: 'VPN', VPN Type: 'L2TP over IPSec'."
              - "Service name: anything you like. Click 'Create'."
              - "Server Address: copy 'Server' from above."
              - "Account Name: copy 'Username' from above."
              - "Click 'Authentication Settings…': User Authentication → Password (paste from above), Machine Authentication → Shared Secret (paste 'Pre-Shared Key')."
              - "Check 'Show VPN status in menu bar', click 'Apply', then 'Connect'."
            zh-CN:
              - "打开「系统偏好设置」→「网络」。"
              - "左下 '+' → 接口：VPN，VPN 类型：L2TP over IPSec。"
              - "服务名称：随便起。点「创建」。"
              - "服务器地址：复制上方「服务器」。"
              - "账户名：复制「用户名」。"
              - "点「鉴定设置…」：用户鉴定 → 密码（粘贴上方密码），机器鉴定 → 共享密钥（粘贴「预共享密钥」）。"
              - "勾选「在菜单栏显示 VPN 状态」，点「应用」→「连接」。"
