name: hysteria
category: vpn
version: 1.0.0
icon: zap
description:
  en-US: "Hysteria 2 proxy — fast, censorship-resistant QUIC-based protocol"
  zh-CN: "Hysteria 2 代理 — 基于 QUIC 的快速抗审查协议"
source:
  url: https://github.com/apernet/hysteria
  license: MIT
limitations:
  - "Uses UDP; some networks may block or throttle UDP traffic"
settings:
  - key: port
    type: number
    min: 1
    max: 65535
    default: 443
    label:
      en-US: "Listen Port"
      zh-CN: "监听端口"
    description:
      en-US: "UDP port the server listens on"
      zh-CN: "服务器监听的 UDP 端口"
  - key: password
    type: string
    default: "{{generated.password}}"
    label:
      en-US: "Password"
      zh-CN: "密码"
    description:
      en-US: "Authentication password for clients"
      zh-CN: "客户端认证密码"
  - key: masquerade_url
    type: string
    default: "https://news.ycombinator.com/"
    advanced: true
    label:
      en-US: "Masquerade URL"
      zh-CN: "伪装网址"
    description:
      en-US: "URL to proxy when masquerading as a normal website"
      zh-CN: "伪装为正常网站时代理的 URL"
generated:
  - key: password
    type: random_string
    length: 32
  - key: stats_secret
    type: random_string
    length: 32
container:
  image: tobyxdd/hysteria
  ports:
    - "{{settings.port}}:443/udp"
  volumes:
    - "{{app.dir}}/configs:/etc/hysteria"
    - "{{node.data_dir}}/ssl/shared:/etc/passim-ssl:ro"
  environment: {}
  labels:
    io.passim: vpn
    io.passim.app: hysteria
  args:
    - "server"
    - "-c"
    - "/etc/hysteria/config.yaml"
clients:
  type: url
  urls:
    - name: "Hysteria 2"
      scheme: "hysteria2://admin%3A{{settings.password}}@{{node.public_ip}}:{{settings.port}}/?sni={{node.domain}}#{{node.hostname}}"
      qr: true
  import_urls:
    stash: "stash://install-config?url={{subscribe_url}}"
    shadowrocket: "sub://{{base64_subscribe_url}}"
share:
  supports: true
  per_user: true
  share_content: [client_config, guide]
guide:
  setup:
    en-US: "Set the listening port and password. A random password is generated by default. TLS certificate is shared from Passim automatically."
    zh-CN: "设置监听端口和密码。默认会自动生成随机密码。TLS 证书自动从 Passim 共享。"
  usage:
    en-US: "Install a Hysteria 2-compatible client below, scan the QR code or paste the subscription URL, and toggle the connection on."
    zh-CN: "在下方安装一个支持 Hysteria 2 的客户端，扫描二维码或粘贴订阅链接，然后打开连接开关。"
  platforms:
    - name: iOS
      notes:
        en-US: "App Store apps for Hysteria 2 are mostly paid. Hiddify is the main free option."
        zh-CN: "iOS 上支持 Hysteria 2 的 App 多数为付费。Hiddify 是主要的免费选择。"
      clients:
        - name: Hiddify
          recommended: true
          homepage_url: https://hiddify.com/
          store_url: https://apps.apple.com/app/hiddify-proxy-vpn/id6596777532
          steps:
            en-US:
              - "Open the App Store, search for 'Hiddify', and install it."
              - "Open Hiddify and tap the '+' icon at the top right."
              - "Choose 'Add from Clipboard' or 'Scan QR code'."
              - "Tap the QR icon next to the connection above and scan it with your phone camera, or copy the subscription URL and paste it."
              - "Once the profile appears, tap the large connection button in the center to connect. iOS will ask you to allow VPN configuration the first time."
            zh-CN:
              - "在 App Store 搜索 'Hiddify' 并安装。"
              - "打开 Hiddify，点击右上角 '+'。"
              - "选择「从剪贴板添加」或「扫描二维码」。"
              - "点击上方连接旁的二维码图标用相机扫描，或复制订阅链接粘贴。"
              - "导入成功后，点击中央的大圆按钮连接。第一次连接时 iOS 会询问是否允许 VPN 配置，点允许即可。"
        - name: Stash
          paid: true
          homepage_url: https://stash.wiki/
          store_url: https://apps.apple.com/app/stash/id1596063349
          steps:
            en-US:
              - "Buy and install Stash from the App Store."
              - "Tap the 'Subs' tab at the bottom, then '+' at the top right."
              - "Paste the subscription URL above and tap 'Done'."
              - "Switch to the 'Home' tab and toggle the connection on."
            zh-CN:
              - "在 App Store 购买并安装 Stash。"
              - "底部切到 'Subs' 标签，点击右上角 '+'。"
              - "粘贴上方订阅链接，点 Done。"
              - "切到 Home 标签，打开顶部连接开关。"
        - name: Shadowrocket
          paid: true
          homepage_url: https://shadowrocket.cloud/
          store_url: https://apps.apple.com/app/shadowrocket/id932747118
          steps:
            en-US:
              - "Buy and install Shadowrocket from the App Store."
              - "Tap the '+' icon at the top right of the home screen."
              - "Choose 'Subscribe' and paste the subscription URL above."
              - "Back on the home screen, toggle the connection on."
            zh-CN:
              - "在 App Store 购买并安装 Shadowrocket。"
              - "在首页点击右上角 '+' 图标。"
              - "选择「订阅」并粘贴上方订阅链接。"
              - "返回首页，打开顶部连接开关。"
    - name: Android
      clients:
        - name: NekoBox
          recommended: true
          homepage_url: https://github.com/MatsuriDayo/NekoBoxForAndroid
          download_url: https://github.com/MatsuriDayo/NekoBoxForAndroid/releases
          steps:
            en-US:
              - "Download the latest NekoBox APK from GitHub Releases (link above) and install it. You may need to allow installation from unknown sources."
              - "Open NekoBox and tap the '+' icon at the bottom."
              - "Choose 'Import from clipboard' (after copying the subscription URL) or 'Scan QR code'."
              - "Tap and hold the imported profile, choose 'Set as current'."
              - "Toggle the large 'Start' button at the bottom right."
            zh-CN:
              - "从上方 GitHub Releases 下载最新版 NekoBox APK 并安装（可能需要在系统设置里允许安装未知来源 App）。"
              - "打开 NekoBox，点击底部 '+' 图标。"
              - "选择「从剪贴板导入」（先复制上方订阅链接）或「扫描二维码」。"
              - "长按导入的配置，选择「设为当前」。"
              - "点击右下角大号 'Start' 按钮启动连接。"
        - name: Hiddify
          homepage_url: https://hiddify.com/
          store_url: https://play.google.com/store/apps/details?id=app.hiddify.com
          steps:
            en-US:
              - "Install Hiddify from Google Play."
              - "Tap '+' at the top right and choose 'Add from Clipboard' or 'Scan QR Code'."
              - "Tap the large connection button in the center."
            zh-CN:
              - "从 Play 商店安装 Hiddify。"
              - "点击右上角 '+' 选择「从剪贴板添加」或「扫描二维码」。"
              - "点击中央大圆按钮连接。"
    - name: macOS
      clients:
        - name: Hiddify
          recommended: true
          homepage_url: https://hiddify.com/
          download_url: https://github.com/hiddify/hiddify-app/releases
          steps:
            en-US:
              - "Download Hiddify for macOS from GitHub Releases (link above)."
              - "Open the .dmg and drag Hiddify to Applications."
              - "Launch Hiddify, click the '+' icon, choose 'Add from Clipboard' or 'Scan QR Code'."
              - "Click the large connection button. macOS will ask for VPN permission the first time."
            zh-CN:
              - "从上方 GitHub Releases 下载 macOS 版 Hiddify。"
              - "打开 .dmg 把 Hiddify 拖到「应用程序」。"
              - "启动 Hiddify，点击 '+' 图标，选择「从剪贴板添加」或「扫描二维码」。"
              - "点击大圆按钮连接。第一次会请求 VPN 权限。"
        - name: Stash
          paid: true
          homepage_url: https://stash.wiki/
          store_url: https://apps.apple.com/app/stash/id1596063349
          steps:
            en-US:
              - "Buy and install Stash from the Mac App Store."
              - "Open Stash, click the menu bar icon, then 'Subscriptions' → '+'."
              - "Paste the subscription URL and click 'Done'."
              - "Toggle the menu bar switch to connect."
            zh-CN:
              - "在 Mac App Store 购买并安装 Stash。"
              - "打开 Stash，点击菜单栏图标，进入「订阅」→ '+'。"
              - "粘贴订阅链接，点 Done。"
              - "切换菜单栏顶部的开关来连接。"
    - name: Windows
      clients:
        - name: Hiddify
          recommended: true
          homepage_url: https://hiddify.com/
          download_url: https://github.com/hiddify/hiddify-app/releases
          steps:
            en-US:
              - "Download the Windows installer (.exe or .msix) from GitHub Releases (link above)."
              - "Run the installer."
              - "Open Hiddify, click '+' and pick 'Add from Clipboard' or 'Scan QR Code'."
              - "Click the large connection button. Windows may prompt to allow Hiddify to set up a network adapter — accept."
            zh-CN:
              - "从上方 GitHub Releases 下载 Windows 安装包（.exe 或 .msix）。"
              - "运行安装程序。"
              - "打开 Hiddify，点 '+' 选择「从剪贴板添加」或「扫描二维码」。"
              - "点击大圆按钮连接。Windows 可能弹窗请求允许 Hiddify 创建网络适配器，点同意。"
        - name: NekoRay
          homepage_url: https://github.com/MatsuriDayo/nekoray
          download_url: https://github.com/MatsuriDayo/nekoray/releases
          steps:
            en-US:
              - "Download nekoray-windows-x64.zip from GitHub Releases."
              - "Unzip and run nekoray.exe (no install needed)."
              - "Menu: Program → Add profile from clipboard (after copying the subscription URL)."
              - "Right-click the profile → 'Set as current', then click 'Start' at the top."
            zh-CN:
              - "从 GitHub Releases 下载 nekoray-windows-x64.zip。"
              - "解压后直接运行 nekoray.exe（免安装）。"
              - "菜单 Program → 从剪贴板添加配置（先复制上方订阅链接）。"
              - "右键配置选「设为当前」，然后点顶部 Start。"
    - name: Linux
      notes:
        en-US: "Hysteria's official CLI is the most reliable option on servers. Hiddify is best for desktop Linux."
        zh-CN: "服务器上推荐用 Hysteria 官方 CLI；桌面环境推荐 Hiddify。"
      clients:
        - name: Hiddify
          recommended: true
          homepage_url: https://hiddify.com/
          download_url: https://github.com/hiddify/hiddify-app/releases
          steps:
            en-US:
              - "Download the Linux AppImage or .deb from GitHub Releases."
              - "Make the AppImage executable: chmod +x Hiddify-*.AppImage"
              - "Run it: ./Hiddify-*.AppImage"
              - "Click '+' and pick 'Add from Clipboard'."
              - "Click the large connection button."
            zh-CN:
              - "从 GitHub Releases 下载 Linux AppImage 或 .deb。"
              - "给 AppImage 加执行权限：chmod +x Hiddify-*.AppImage"
              - "运行：./Hiddify-*.AppImage"
              - "点击 '+'，选择「从剪贴板添加」。"
              - "点击大圆按钮连接。"
        - name: Hysteria CLI
          homepage_url: https://v2.hysteria.network/
          download_url: https://github.com/apernet/hysteria/releases
          steps:
            en-US:
              - "Install with the official one-liner: bash <(curl -fsSL https://get.hy2.sh/)"
              - "Download the per-user config file from your share link (the .yaml/.json under 'Connection' above)."
              - "Save it as /etc/hysteria/config.yaml"
              - "Start as a systemd service: systemctl enable --now hysteria-client@config.service"
              - "Configure your system or browser to use SOCKS5 / HTTP proxy on the local port specified in the config."
            zh-CN:
              - "用官方一键脚本安装：bash <(curl -fsSL https://get.hy2.sh/)"
              - "从分享链接下载本人对应的配置文件（上方「Connection」中的 .yaml/.json）。"
              - "保存为 /etc/hysteria/config.yaml"
              - "用 systemd 启动服务：systemctl enable --now hysteria-client@config.service"
              - "把系统或浏览器设置为使用配置里指定的本地 SOCKS5 / HTTP 代理端口。"
config:
  files:
    - path: "config.yaml"
      template: |
        listen: :443
        tls:
          cert: /etc/passim-ssl/cert.pem
          key: /etc/passim-ssl/key.pem
        auth:
          type: http
          http:
            url: https://{{node.domain}}:{{node.port}}/api/internal/app-auth/{{app.id}}
            insecure: false
        trafficStats:
          listen: :9999
          secret: {{generated.stats_secret}}
        masquerade:
          type: proxy
          proxy:
            url: {{settings.masquerade_url}}
            rewriteHost: true
users:
  add:
    method: http_auth
  remove:
    method: http_auth
  list:
    method: http_auth
  kick:
    method: api
    url: "http://{{container_ip}}:9999/kick"
    secret: "{{generated.stats_secret}}"
  fields:
    - key: username
      type: string
      label:
        en-US: "Username"
        zh-CN: "用户名"
      required: true
    - key: password
      type: string
      label:
        en-US: "Password"
        zh-CN: "密码"
      required: true
metrics:
  per_user:
    method: api
    # clear=1 makes Hysteria2 atomically return+reset the counter, so each
    # poll yields a delta rather than a cumulative total. Without it, the
    # summed rows would over-count quadratically over time.
    url: "http://{{container_ip}}:9999/traffic?clear=1"
    secret: "{{generated.stats_secret}}"
    online_url: "http://{{container_ip}}:9999/online"
  interval: "60s"
